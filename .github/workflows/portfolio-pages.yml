name: Auto-update portfolio stats and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find portfolio source folder
        id: layout
        run: |
          if [ -f portfolio/data/profile.json ]; then
            echo 'dir=portfolio' >> "$GITHUB_OUTPUT"
          else
            echo 'dir=.' >> "$GITHUB_OUTPUT"
          fi
          echo 'hash=${{ hashFiles('**/data/profile.json') }}' >> "$GITHUB_OUTPUT"
      - name: Restore last successful LeetCode snapshot
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.layout.outputs.dir }}/data/leetcode.json
          key: lc-${{ github.repository }}-${{ steps.layout.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lc-${{ github.repository }}-${{ steps.layout.outputs.hash }}-
      - name: Refresh public LeetCode data (safe fallback)
        working-directory: ${{ steps.layout.outputs.dir }}
        run: python scripts/update_leetcode.py
      - name: Refresh public GitHub data
        continue-on-error: true
        working-directory: ${{ steps.layout.outputs.dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github.py
      - name: Save last successful LeetCode snapshot
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.layout.outputs.dir }}/data/leetcode.json
          key: lc-${{ github.repository }}-${{ steps.layout.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build portable website
        working-directory: ${{ steps.layout.outputs.dir }}
        run: |
          python scripts/bundle.py
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.layout.outputs.dir }}/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
